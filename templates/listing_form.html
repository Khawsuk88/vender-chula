{% extends 'base.html' %}{% block content %}<div class="panel"><span class="eyebrow">VENDER CHULA</span><h1>{{'Edit post' if listing else 'Create a post'}}</h1><p class="muted">Listings are reviewed before appearing publicly.</p><form method="post" enctype="multipart/form-data" class="form gridform"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Post type<select name="listing_type"><option value="selling" {% if listing and listing.listing_type=='selling' %}selected{% endif %}>I'm selling</option><option value="wanted" {% if listing and listing.listing_type=='wanted' %}selected{% endif %}>I'm looking for</option></select></label><label>Category<select name="category">{% for c in categories %}<option value="{{c}}" {% if listing and listing.category==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select></label><label class="wide">Title<input required name="title" value="{{listing.title if listing else ''}}" placeholder="e.g. iPad Air 5th Gen"></label><label>Price / budget (THB; 0 for open offers)<input required type="number" min="0" name="price" value="{{listing.price if listing else ''}}"></label><label>Meetup location<input required name="location" value="{{listing.location if listing else ''}}" placeholder="e.g. Siam Square"></label><label class="wide">Description<textarea name="description" rows="6" required>{{listing.description if listing else ''}}</textarea></label>{% if not listing %}<label class="wide">Photos (1–6 for selling; optional for wanted)<input type="file" name="photos" multiple accept="image/jpeg,image/png,image/webp"></label>{% else %}<p class="wide muted">Existing photos remain unchanged.</p>{% endif %}<button class="btn">Submit for review</button></form></div>{% endblock %}
