{% extends 'base.html' %}{% block content %}<div class="panel narrow"><span class="eyebrow">CHULA STUDENTS ONLY</span><h1>Join Vender Chula</h1><p class="muted">Registration requires an approved Chulalongkorn email address. You must click the verification link we send before you can sign in.</p><form method="post" class="form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Your name<input name="name" required></label><label>Chula email<input name="email" type="email" placeholder="name@student.chula.ac.th" required></label><label>Password (8+ characters)<input name="password" type="password" minlength="8" required></label><button class="btn">Send verification email</button></form><p>Already verified? <a href="/login">Log in</a></p></div>{% endblock %}
