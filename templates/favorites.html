{% extends 'base.html' %}{% block content %}<span class="eyebrow">YOUR SHORTLIST</span><h1>Saved listings</h1><div class="cards">{% for l in listings %}<a class="card" href="/listing/{{l.id}}"><div class="photo">{% if l.photo %}<img src="{{url_for('static',filename='uploads/'+l.photo)}}" alt="{{l.title}}">{% else %}<div class="placeholder">📦</div>{% endif %}</div><div class="cardbody"><div class="price">฿{{'{:,}'.format(l.price)}}</div><h3>{{l.title}}</h3><p>{{l.category}} · {{l.location}}</p></div></a>{% else %}<p>Nothing saved yet. <a href="/">Explore listings</a>.</p>{% endfor %}</div>{% endblock %}
