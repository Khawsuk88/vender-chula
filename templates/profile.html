{% extends 'base.html' %}{% block content %}<div class="panel narrow"><span class="eyebrow">ACCOUNT SETTINGS</span><h1>Edit profile</h1><form method="post" enctype="multipart/form-data" class="form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Your name<input name="name" required value="{{me.name}}"></label>{% if me.kind=='business' %}<label>Business name<input name="business_name" required value="{{me.business_name or ''}}"></label><label>Dealership logo (JPG/PNG/WEBP)<input type="file" name="logo" accept="image/jpeg,image/png,image/webp"></label>{% endif %}<label>Phone<input name="phone" value="{{me.phone or ''}}"></label><label>LINE ID<input name="line_id" value="{{me.line_id or ''}}"></label><button class="btn">Save profile</button></form></div>{% endblock %}
